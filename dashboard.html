<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase | My account</title>
  <style>
    :root { --ink:#182230; --muted:#667085; --brand:#2855c5; --radius:16px;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink);
      background:linear-gradient(145deg,#f4f7ff 0%,#f9fbff 45%,#eef3fa 100%);
      display:grid; place-items:center; padding:24px; }
    .card { background:#fff; border:1px solid #e5eaf1; border-radius:var(--radius);
      padding:36px 32px; width:min(100%,460px); text-align:center;
      box-shadow:0 18px 50px rgba(27,48,84,.07); }
    h1 { margin:0 0 8px; font-size:26px; }
    p  { margin:0 0 22px; color:var(--muted); font-size:14px; }
    .primary { min-height:44px; padding:0 22px; border:0; border-radius:9px;
      color:#fff; background:var(--brand); font-weight:800; cursor:pointer; }
    .primary:hover { background:#1d429f; }
    #who { font-weight:700; color:var(--ink); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome 👋</h1>
    <p>Signed in as <span id="who">…</span></p>
    <button class="primary" id="signout">Sign Out</button>
  </div>
  <script>
    const API = (window.SHOPEASE_API_BASE || 'http://127.0.0.1:5000').replace(/\/+$/, '');

    fetch(API + '/api/me', { credentials: 'include' })
      .then(r => r.json())
      .then(d => {
        if (!d.success) return location.href = 'signin.html';
        document.getElementById('who').textContent = d.user.email;
      })
      .catch(() => location.href = 'signin.html');

    document.getElementById('signout').addEventListener('click', async () => {
      await fetch(API + '/api/signout', { method: 'POST', credentials: 'include' });
      location.href = 'signin.html';
    });
  </script>
</body>
</html>
